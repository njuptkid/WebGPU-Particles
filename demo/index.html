<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>折叠机 · 细粒子开发基准</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111925;color:#eef3fa;font:15px "Microsoft YaHei",sans-serif}header,main{max-width:1400px;margin:auto;padding:24px}header{border-bottom:1px solid #ffffff20}h1{font-size:28px;margin:0 0 12px}p{line-height:1.7;color:#acbfd1}.controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 0}button,select{padding:10px 16px;background:#26364b;color:#f6f8ff;border:1px solid #668095;border-radius:8px}input[type=range]{width:290px}a{color:#9cdedc}.screens{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}.panel{background:#0c121d;padding:18px;border:1px solid #456075;border-radius:12px}canvas{width:100%;height:430px;object-fit:contain;display:block}#outer{height:430px}.info{font-size:13px;color:#a7bacf}.preview{outline:2px solid #7ee2da}.warn{color:#ffd18c}@media(max-width:800px){.screens{grid-template-columns:1fr}canvas{height:300px}}[hidden]{display:none!important}</style>
<header><h1>细粒子 · 手机端实现基准</h1><p>桌面元素碎化 / 应用内先识别完整内容块、再原位碎化。此演示不提供整图标、整块飞行模式。</p><a href="compare.html">原版 / 预计算同步对照</a> · <a href="../交付说明.html">打开交付说明</a> · <a href="../references/应用内_确认版_闭合展开闭合.mp4">原机模确认视频</a></header>
<main><div class="controls"><label>场景 <select id="scene"><option value="desktop">桌面图标细粒子</option><option value="app">应用内分块细粒子</option></select></label><label><input id="reverse" type="checkbox" checked>外屏从左向右凝聚</label><button id="play">播放闭合 → 展开 → 闭合</button><button id="preview">查看内容识别</button></div>
<div class="controls"><label>开合角度 <input id="angle" type="range" min="0" max="180" step=".1" value="0"></label><output id="angleValue">0°</output><label>采样档位 <select id="quality"><option value="1.5">原型基准 1.5</option><option value="2.5">较低粒子量 2.5</option><option value="4">快速预览 4.0</option></select></label><label><input id="precompute" type="checkbox">预计算粒子固定噪声（实验）</label><label><input id="releaseCache" type="checkbox">同时缓存原图释放扰动（实验）</label></div>
<p id="status" role="status">准备素材…</p><div class="screens"><section class="panel"><h2>内屏</h2><canvas id="inner" width="1292" height="914"></canvas><p class="info" id="innerInfo"></p></section><section class="panel"><h2>外屏</h2><canvas id="outer" width="632" height="924"></canvas><p class="info" id="outerInfo"></p></section></div>
<p class="warn">这是算法与参数复核用 WebGL 演示，不是手机 SDK。降档只减少粒子数量；正式端点仍使用原始界面，不能靠降低完整界面清晰度提速。</p></main>
<script src="../src/shader-sources.js"></script><script src="../src/content-regions.js"></script><script src="../src/app-block-extractor.js"></script><script src="../src/fold-clock.js"></script><script src="../src/particle-renderer.js"></script><script src="demo.js"></script></html>
